[package]
name = "potato-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Independent Rust desktop UI experiment for Potato"

[features]
default = ["gpu"]
gpu = ["iced/wgpu"]

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "tokio", "advanced", "svg", "markdown", "image", "highlighter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.11", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
uuid = { version = "1", features = ["v4"] }
chrono-tz = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
potato-core = { path = "../potato-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
dirs = "5"
base64 = "0.22"
rfd = "0.16"
open = "5"
cpal = "0.15.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.compact]
inherits = "release"
opt-level = "s"
lto = "fat"

