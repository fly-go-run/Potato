[package]
name = "potato-windows-sandbox"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Windows LPAC process boundary for Potato"

[dependencies]
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects",
    "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3"
