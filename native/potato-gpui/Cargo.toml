[package]
name = "potato-gpui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Potato native desktop application using GPUI Kit"

[dependencies]
gpui-kit = "=0.6.0"
anyhow = "1"
base64 = "0.22"
cpal = "0.15.3"
potato-core = { path = "../potato-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = "0.4"
rfd = "0.16"
open = "5"
markdown = "1.0"
percent-encoding = "2"
syntect = "5.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
gpui-kit = { version = "=0.6.0", features = ["test-support"] }

[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
