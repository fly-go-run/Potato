[package]
name = "potato-desktop"
version = "0.1.0"
description = "Potato Desktop Tauri shell that wraps the Potato Console frontend and runs the Python FastAPI backend as a local sidecar process."
authors = ["Potato Contributors"]
license = "Apache-2.0"
repository = "https://github.com/fly-go-run/Potato"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
semver = "1"
base64 = "0.22"
minisign-verify = "0.2"
sha2 = "0.10"
tauri = { version = "2.10.3", features = ["tray-icon", "devtools", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSWindow", "NSView", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
